version: 1

# Marvel's Spider-Man 2 is a merged JSONL file. OneVision uses the named-subset Parquet
# layout documented in docs/dataset_paths.md. The mixture parser counts each
# source using its own format, while ms-swift accepts both path types together.
format: mixed
default_dataset_format: parquet
root: /projects/b6db/opensima/vlm_data/LLaVA-OneVision-1.5-Instruct-Data-qwen-format
val: /projects/b6db/opensima/sft_data/processed_bc_2077_spider/_by_game/marvel_spider_2/val.jsonl
download: never
hf_max_workers: 8

loader:
  streaming: true
  dataset_shuffle: true
  shuffle_buffer_size: 10000
  dataset_mix: interleave
  interleave_unit: dataset
  interleave_weight: sample_count
  stopping_strategy: all_exhausted
  enable_channel_loss: true
  # The launcher maps both the game's `game` and OneVision's `data_source` to
  # ms-swift's canonical `channel` field.
  channel_columns:
    game: channel
    data_source: channel
  add_genshin_special_tokens: true

# Spider-Man 2 train rows: 60,711. Validation rows: 31.
# LLaVA-OneVision rows: 21,847,820. LLaVA has no validation dataset.


# passes controls total sample exposure for the whole task. The trainer still
# runs exactly one epoch over these expanded quotas.
datasets:
  marvel_spider_2:
    path: /projects/b6db/opensima/sft_data/processed_bc_2077_spider/_by_game/marvel_spider_2/train.jsonl
    format: jsonl
    passes: 3.0
