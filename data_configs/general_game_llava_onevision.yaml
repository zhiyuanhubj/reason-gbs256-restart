version: 1

# Game data is split into JSONL training sets. Dataset names and paths use the
# final component of repo_id from docs/hf_dataset_path.csv, without `_bc_01`;
# guided entries come first. OneVision uses the named-subset Parquet layout.
format: mixed
default_dataset_format: parquet
root: ${LLAVA_DATA_ROOT}
# Existing guided validation splits documented in docs/dataset_paths.md.
# General-game unguided data, caption data, and OneVision are training-only.
val:
  - /projects/b6db/opensima/data/genshin_bc_sl135/_merged/val.jsonl
  - /projects/b6db/opensima/sft_data/processed_bc_2077_spider/_by_game/marvel_spider_2/val.jsonl
  - /projects/b6db/opensima/sft_data/processed_bc_2077_spider/_by_game/cyberpunk_2077/val.jsonl
download: never
hf_max_workers: 8

loader:
  streaming: true
  dataset_shuffle: true
  shuffle_buffer_size: 10000
  dataset_mix: interleave
  interleave_unit: dataset
  interleave_weight: sample_count
  stopping_strategy: all_exhausted
  enable_channel_loss: true
  channel_columns:
    game: channel
    data_source: channel
  add_genshin_special_tokens: true


# Game: 128,632,126,511
# LLaVA-OneVision: 20.142B
# caption: 42.57M



# Each game path uses the final component of its CSV repo_id with the trailing
# `_bc_01` removed, under GENERAL_GAME_DATA_ROOT.
# passes controls total sample exposure; train this expanded mixture for one epoch.
datasets:
